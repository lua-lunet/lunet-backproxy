name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs_on: ubuntu-24.04
          - name: linux-arm64
            runs_on: ubuntu-24.04-arm
          - name: macos-arm64
            runs_on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            sqlite3 \
            luajit \
            libuv1 \
            curl \
            git \
            jq

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install luajit libuv zlib sqlite jq

      - name: Prepare Runtime
        run: |
          xmake run setup-lunet

      - name: Run Tests
        env:
          ENABLE_CONDUIT_DEMO: "1"
        run: |
          xmake test

  compose-e2e:
    name: compose-e2e-${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs_on: ubuntu-24.04
          - name: linux-arm64
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build and run echo topology
        run: |
          docker compose --profile echo up --build -d
          state=""
          for _ in $(seq 1 60); do
            state="$(docker inspect --format '{{.State.Health.Status}}' lunet-backproxy-dmz 2>/dev/null || echo starting)"
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          if [ "$state" != "healthy" ]; then
            docker compose --profile echo logs
            exit 1
          fi
          ./scripts/docker/load-gentle.sh /health
          ./scripts/docker/load-gentle.sh /hello

      - name: Tear down
        if: always()
        run: docker compose --profile echo down -v
