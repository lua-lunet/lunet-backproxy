name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or commit SHA to run CI against"
        required: false
        default: ""
        type: string
      include_windows:
        description: "Run optional Windows smoke job"
        required: false
        default: true
        type: boolean

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs_on: ubuntu-24.04
          - name: linux-arm64
            runs_on: ubuntu-24.04-arm
          - name: macos-arm64
            runs_on: macos-latest

    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_ref == '' }}

      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' }}
        with:
          ref: ${{ inputs.target_ref }}

      - name: Show selected revision
        run: |
          echo "event=${{ github.event_name }}"
          echo "target_ref_input=${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || 'n/a' }}"
          git rev-parse HEAD
          git show -s --format='%h %d %s'

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libuv1-dev \
            luajit \
            libluajit-5.1-dev \
            sqlite3 \
            libsodium-dev \
            curl \
            git \
            jq

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libuv luajit sqlite libsodium coreutils git jq

      - name: Prepare Runtime
        run: |
          xmake run setup-lunet

      - name: Run Tests
        env:
          ENABLE_CONDUIT_DEMO: "1"
        run: |
          xmake test

  windows-smoke:
    name: windows-smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_windows }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.target_ref == '' }}

      - uses: actions/checkout@v4
        if: ${{ inputs.target_ref != '' }}
        with:
          ref: ${{ inputs.target_ref }}

      - name: Show selected revision
        shell: bash
        run: |
          echo "event=${{ github.event_name }}"
          echo "target_ref_input=${{ inputs.target_ref }}"
          git rev-parse HEAD
          git show -s --format='%h %d %s'

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Check xmake availability
        shell: pwsh
        run: |
          xmake --version

      - name: Validate shell script syntax
        shell: bash
        run: |
          bash -n scripts/setup-lunet.sh \
            scripts/lunet-env.sh \
            scripts/run-tests.sh \
            scripts/start-dmz.sh \
            scripts/start-internal.sh \
            scripts/start-echo.sh
