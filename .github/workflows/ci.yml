name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs_on: ubuntu-24.04
          - name: linux-arm64
            runs_on: ubuntu-24.04-arm
          - name: macos-arm64
            runs_on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libuv1-dev \
            luajit \
            libluajit-5.1-dev \
            sqlite3 \
            libsodium-dev \
            curl \
            git \
            jq

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libuv luajit sqlite libsodium coreutils git jq

      - name: Prepare Runtime
        run: |
          xmake run setup-lunet

      - name: Run Tests
        env:
          ENABLE_CONDUIT_DEMO: "1"
        run: |
          xmake test
